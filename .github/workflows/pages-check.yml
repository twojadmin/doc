name: Pages check
on:
  push:
    branches: ["claude/pages-check"]
permissions:
  contents: read
  pages: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "== Pages config"; gh api "repos/${{ github.repository }}/pages" --jq '{build_type, source, html_url, status}' || true
          for u in "https://twojadmin.github.io/doc/" "https://twojadmin.github.io/doc/news.json"; do
            echo "== $u"; curl -sS -o /tmp/p -w "HTTP %{http_code} %{content_type}\n" "$u"; head -c 300 /tmp/p | tr '\n' ' '; echo
            grep -o '<title>[^<]*' /tmp/p || true
          done
